name: Bug report
description: Something shows wrong, does not install or crashes
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings, About.
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Build
      options:
        - Installer
        - Portable
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source involved
      description: winget, pip, a game launcher, the cleanup window, ...
  - type: textarea
    id: log
    attributes:
      label: Log lines
      description: The relevant lines from the log in the data folder. It already hides paths and anything shaped like a password.
      render: text
